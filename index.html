    // Helper: Safely separate Arabic graphemes (letters + attached diacritics)
    function getArabicGraphemes(str) {
      if (!str) return [];
      const graphemes = [];
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        if (/[\u064B-\u065F\u0670]/.test(char) && graphemes.length > 0) {
          graphemes[graphemes.length - 1] += char;
        } else {
          graphemes.push(char);
        }
      }
      return graphemes;
    }

    // Convert PCM16 array buffer to WAV Blob
    function pcmToWav(pcmData, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const dataSize = pcmData.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeString = (v, offset, str) => {
        for (let i = 0; i < str.length; i++) {
          v.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcmData.length; i++, offset += 2) {
        view.setInt16(offset, pcmData[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    let currentAudio = new Audio();
    let isIosAudioUnlocked = false;

    // Unlock iOS Audio stack synchronously inside user touch event tick
    function unlockIosAudio() {
      if (!isIosAudioUnlocked && currentAudio) {
        try {
          currentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
          const p = currentAudio.play();
          if (p && p.then) {
            p.then(() => { isIosAudioUnlocked = true; }).catch(() => {});
          }
        } catch (e) {}
      }
    }

    async function playAudioText(text, promptInstruction = "", onStateChange = () => {}) {
      if (!text) return;

      unlockIosAudio();

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      onStateChange(true);
      const trimmed = text.trim();
      const cacheKey = promptInstruction ? `${trimmed}_${promptInstruction}` : trimmed;

      if (audioCache[cacheKey]) {
        try {
          currentAudio.src = audioCache[cacheKey];
          currentAudio.onended = () => onStateChange(false);
          currentAudio.onerror = () => fallbackGoogleTTS(trimmed, cacheKey, onStateChange);
          await currentAudio.play();
          return;
        } catch (e) {}
      }

      try {
        const apiKey = "";
        if (apiKey) {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

          let promptText = "";
          if (promptInstruction) {
            promptText = `You are an expert Arabic teacher speaking Modern Standard Arabic. Do NOT say letter names like zhaa or taa or ain under any circumstances. ${promptInstruction}. Pronounce with maximum clarity and exact Mufakhkham/Muraqqaq phonetic contrast: "${trimmed}"`;
          } else {
            promptText = `Say clearly in natural Modern Standard Arabic using a clear, warm female teacher voice. Do NOT say letter names. Pronounce ONLY the exact word or short vowel sound: "${trimmed}"`;
          }

          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: "Sulafat" }
                }
              }
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.[0];
            const audioData = part?.inlineData?.data;
            const mimeType = part?.inlineData?.mimeType;

            if (audioData && mimeType && mimeType.startsWith("audio/")) {
              const sampleRateMatch = mimeType.match(/rate=(\d+)/);
              const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
              const pcmBuffer = base64ToArrayBuffer(audioData);
              const pcm16 = new Int16Array(pcmBuffer);
              const wavBlob = pcmToWav(pcm16, sampleRate);
              const audioUrl = URL.createObjectURL(wavBlob);
              
              audioCache[cacheKey] = audioUrl;

              currentAudio.src = audioUrl;
              currentAudio.onended = () => onStateChange(false);
              currentAudio.onerror = () => fallbackGoogleTTS(trimmed, cacheKey, onStateChange);
              await currentAudio.play();
              return;
            }
          }
        }
      } catch (err) {}

      fallbackGoogleTTS(trimmed, cacheKey, onStateChange);
    }

    async function fallbackGoogleTTS(text, cacheKey, onStateChange) {
      try {
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ar&client=tw-ob`;
        currentAudio.src = ttsUrl;

        currentAudio.onended = () => onStateChange(false);
        currentAudio.onerror = () => speakWithWebSpeech(text, onStateChange);

        if (cacheKey) {
          audioCache[cacheKey] = ttsUrl;
        }

        await currentAudio.play();
      } catch (err) {
        speakWithWebSpeech(text, onStateChange);
      }
    }

    function speakWithWebSpeech(text, onStateChange) {
      if (!('speechSynthesis' in window)) {
        onStateChange(false);
        return;
      }
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.8;
      utterance.pitch = 1.3;
      utterance.volume = 1.0;

      const assignFemaleVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        let targetVoice = voices.find(v => 
          v.lang.startsWith('ar') && 
          (v.name.toLowerCase().includes('female') || 
           v.name.toLowerCase().includes('laila') || 
           v.name.toLowerCase().includes('salma') || 
           v.name.toLowerCase().includes('marium') ||
           v.name.toLowerCase().includes('zira') ||
           v.name.toLowerCase().includes('hoda') ||
           v.name.toLowerCase().includes('siri'))
        );

        if (!targetVoice) {
          targetVoice = voices.find(v => 
            v.lang.startsWith('ar') && 
            !v.name.toLowerCase().includes('male') && 
            !v.name.toLowerCase().includes('naayf') &&
            !v.name.toLowerCase().includes('tarik') &&
            !v.name.toLowerCase().includes('maged')
          );
        }

        if (targetVoice) {
          utterance.voice = targetVoice;
        }
      };

      assignFemaleVoice();

      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = assignFemaleVoice;
      }

      let ended = false;
      const finish = () => {
        if (!ended) {
          ended = true;
          onStateChange(false);
        }
      };

      utterance.onend = finish;
      utterance.onerror = finish;
      window.speechSynthesis.speak(utterance);

      setTimeout(finish, 2000);
    }

    function QuizView({ playAudioText }) {
      const [quizState, setQuizState] = useState(() => initQuizQuestions(ARABIC_DATABASE));

      function initQuizQuestions(db) {
        const questions = [];

        // Part 1: 5 Short Vowels Questions
        const dbShuffled = [...db].sort(() => 0.5 - Math.random());
        for (let i = 0; i < 5; i++) {
          const targetItem = dbShuffled[i];
          const wrongOptions = db.filter(item => item.id !== targetItem.id).sort(() => 0.5 - Math.random()).slice(0, 3);
          const options = [targetItem, ...wrongOptions].sort(() => 0.5 - Math.random());
          questions.push({
            type: "vowel",
            title: `السؤال ${i + 1} من 20: استمع لصوت الحرف بالحركة واختر الشكل الصحيح`,
            targetSound: targetItem.sounds.fatha,
            promptText: `Pronounce ONLY the short vowel sound '${targetItem.sounds.fatha}' clearly without saying letter names.`,
            targetLetter: targetItem.letter,
            options: options.map(o => ({ id: o.id, label: o.letter }))
          });
        }

        // Part 2: 5 Phonetic Minimal Pairs Questions
        const pairShuffled = [...SIMILAR_SOUNDS].sort(() => 0.5 - Math.random()).slice(0, 5);
        for (let i = 0; i < 5; i++) {
          const pair = pairShuffled[i];
          const isA = Math.random() > 0.5;
          const targetSound = isA ? pair.soundA : pair.soundB;
          const promptText = isA ? (pair.promptSoundA || `Pronounce ${pair.soundA}`) : (pair.promptSoundB || `Pronounce ${pair.soundB}`);
          const targetLabel = isA ? pair.soundA : pair.soundB;
          questions.push({
            type: "contrast",
            title: `السؤال ${i + 6} من 20: التمييز بين الأصوات المتقاربة (${pair.pair})`,
            targetSound: targetSound,
            promptText: promptText,
            targetLetter: targetLabel,
            options: [
              { id: "A", label: pair.soundA },
              { id: "B", label: pair.soundB }
            ]
          });
        }

        // Part 3: 10 Full Words Questions from Lesson Database
        const allWords = [];
        db.forEach(item => {
          item.words.forEach(w => {
            allWords.push({ word: w.word, letter: item.letter, image: w.image });
          });
        });

        const wordShuffled = [...allWords].sort(() => 0.5 - Math.random()).slice(0, 10);
        for (let i = 0; i < 10; i++) {
          const targetWordObj = wordShuffled[i];
          const wrongWords = allWords
            .filter(w => w.word !== targetWordObj.word)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3);

          const options = [targetWordObj, ...wrongWords].sort(() => 0.5 - Math.random());
          questions.push({
            type: "word",
            title: `السؤال ${i + 11} من 20: استمع للكلمة ثم اختر الكلمة الصحيحة`,
            targetSound: targetWordObj.word,
            promptText: `Pronounce the Arabic word '${targetWordObj.word}' with clear Modern Standard Arabic pronunciation.`,
            targetLetter: targetWordObj.word,
            options: options.map((w, idx) => ({ id: `${w.word}_${idx}`, label: w.word }))
          });
        }

        return {
          questions,
          currentIndex: 0,
          score: 0,
          selectedAnswer: null,
          isCorrect: null,
          isFinished: false
        };
      }

      const { questions, currentIndex, score, selectedAnswer, isCorrect, isFinished } = quizState;
      const currentQ = questions[currentIndex];

      const handleCheck = (optionLabel) => {
        if (selectedAnswer !== null) return;
        const correct = optionLabel === currentQ.targetLetter;
        setQuizState(prev => ({
          ...prev,
          selectedAnswer: optionLabel,
          isCorrect: correct,
          score: correct ? prev.score + 1 : prev.score
        }));
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setQuizState(prev => ({
            ...prev,
            currentIndex: prev.currentIndex + 1,
            selectedAnswer: null,
            isCorrect: null
          }));
        } else {
          setQuizState(prev => ({ ...prev, isFinished: true }));
        }
      };

      const handleRestart = () => {
        setQuizState(initQuizQuestions(ARABIC_DATABASE));
      };

      if (isFinished) {
        const finalPercent = Math.round((score / 20) * 100);
        return (
          <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-8 max-w-xl mx-auto text-center space-y-6">
            <div className="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
              🏆
            </div>
            <h3 className="text-3xl font-black text-slate-900">نتيجة الاختبار الإجمالية</h3>
            <div className="text-5xl font-black text-emerald-600 font-mono">{score} / 20</div>
            <p className="text-sm font-extrabold text-slate-600">النسبة المئوية: {finalPercent}%</p>
            <p className="text-xs text-slate-500 font-bold">
              {finalPercent >= 80 ? "ممتاز جداً! أداء رائع في استماع وتطبيق الأصوات والكلمات 👏" : "أحسنت! يمكنك إعادة الاختبار للمزيد من التدريب والتفوق 👍"}
            </p>
            <button 
              onClick={handleRestart}
              className="btn-tactile px-8 py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold rounded-2xl shadow-lg border-b-4 border-emerald-800"
            >
              إعادة الاختبار بأسئلة جديدة 🔄
            </button>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 sm:p-8 max-w-2xl mx-auto text-center space-y-6">
          <div className="flex justify-between items-center border-b pb-4">
            <div>
              <h3 className="text-xl font-black text-slate-900">{currentQ.title}</h3>
              <p className="text-xs text-slate-500 font-bold mt-0.5">
                {currentQ.type === 'vowel' && "القسم 1: أصوات الحركات القصيرة"}
                {currentQ.type === 'contrast' && "القسم 2: التمييز بين الأصوات المتقاربة"}
                {currentQ.type === 'word' && "القسم 3: الاستماع للكلمات كاملة"}
              </p>
            </div>
            <div className="bg-emerald-100 text-emerald-800 font-black text-sm px-4 py-2 rounded-2xl border border-emerald-200">
              النتيجة: {score} / 20
            </div>
          </div>

          <div className="bg-gradient-to-br from-emerald-50/80 to-teal-50/80 border-2 border-emerald-100 rounded-3xl p-6 space-y-4">
            <p className="text-xs font-bold text-emerald-900">اضغط للاستماع إلى الصوت المطلوب:</p>
            <button 
              onClick={() => playAudioText(currentQ.targetSound, currentQ.promptText)}
              className="btn-tactile p-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-full shadow-lg border-b-4 border-emerald-800 inline-flex items-center justify-center cursor-pointer"
              title="استمع للصوت"
            >
              <Volume2 className="w-10 h-10" />
            </button>
          </div>

          {/* Options Grid - STRICTLY FIXED POSITIONS */}
          <div className={`grid gap-4 ${currentQ.options.length === 2 ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-4'}`}>
            {currentQ.options.map((opt) => (
              <button 
                key={opt.id}
                onClick={() => handleCheck(opt.label)}
                disabled={selectedAnswer !== null}
                className={`btn-tactile py-5 px-3 text-3xl font-black rounded-2xl border-2 shadow-sm ${
                  selectedAnswer === opt.label 
                    ? isCorrect ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-rose-500 text-white border-rose-600 shadow-md'
                    : 'bg-slate-50 hover:bg-slate-100 border-slate-200/80 text-slate-900 hover:border-emerald-400'
                }`}
              >
                {opt.label}
              </button>
            ))}
          </div>

          {/* Feedback */}
          {selectedAnswer && (
            <div className="space-y-4 pt-2">
              <div className={`p-4 rounded-2xl font-black text-sm ${isCorrect ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-rose-100 text-rose-900 border border-rose-200'}`}>
                {isCorrect ? 'إجابة صحيحة! أحسنت 👏' : `إجابة خاطئة! الإجابة الصحيحة هي (${currentQ.targetLetter})`}
              </div>
              <button 
                onClick={handleNext}
                className="btn-tactile px-8 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold border-b-4 border-black rounded-2xl text-sm shadow-md"
              >
                {currentIndex < questions.length - 1 ? 'السؤال التالي ➔' : 'عرض النتيجة النهائية 🏆'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedLetterId, setSelectedLetterId] = useState(1);
      const [slideIndex, setSlideIndex] = useState(0);

      const [completedLetters, setCompletedLetters] = useState(() => {
        try {
          const saved = localStorage.getItem('arabic_phonics_completed');
          return saved ? JSON.parse(saved) : [1];
        } catch (e) {
          return [1];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('arabic_phonics_completed', JSON.stringify(completedLetters));
        } catch (e) {}
      }, [completedLetters]);

      const currentLetter = ARABIC_DATABASE.find(item => item.id === selectedLetterId) || ARABIC_DATABASE[0];

      const markLetterComplete = (id) => {
        if (!completedLetters.includes(id)) {
          setCompletedLetters(prev => [...prev, id]);
        }
      };

      const handleNextSlide = () => {
        if (slideIndex < 3) {
          setSlideIndex(prev => prev + 1);
        } else {
          markLetterComplete(currentLetter.id);
          if (selectedLetterId < 28) {
            setSelectedLetterId(prev => prev + 1);
            setSlideIndex(0);
          } else {
            setActiveTab('home');
          }
        }
      };

      const handlePrevSlide = () => {
        if (slideIndex > 0) {
          setSlideIndex(prev => prev - 1);
        } else if (selectedLetterId > 1) {
          setSelectedLetterId(prev => prev - 1);
          setSlideIndex(3);
        }
      };

      const startLetterUnit = (id) => {
        setSelectedLetterId(id);
        setSlideIndex(0);
        setActiveTab('unit');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans dir-rtl text-right select-none pb-12">
          {/* Header */}
          <header className="bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3 space-x-reverse cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="bg-white/10 p-2.5 rounded-2xl border border-white/20">
                  <Sparkles className="w-7 h-7 text-amber-300" />
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-black font-serif">العربية من الصوت إلى الكلمة</h1>
                  <p className="text-xs text-emerald-100 font-medium">إعداد: أ/ عائشة إبراهيم</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1.5 md:gap-2">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`btn-tactile px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 ${
                    activeTab === 'home' ? 'bg-white text-emerald-800 shadow-md' : 'bg-emerald-800/60 text-white'
                  }`}
                >
                  <Home className="w-4 h-4" />
                  <span>الرئيسية</span>
                </button>

                <button
                  onClick={() => setActiveTab('special')}
                  className={`btn-tactile px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 ${
                    activeTab === 'special' ? 'bg-white text-emerald-800 shadow-md' : 'bg-emerald-800/60 text-white'
                  }`}
                >
                  <BookOpen className="w-4 h-4" />
                  <span>أصوات إضافية</span>
                </button>

                <button
                  onClick={() => setActiveTab('minimal')}
                  className={`btn-tactile px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 ${
                    activeTab === 'minimal' ? 'bg-white text-emerald-800 shadow-md' : 'bg-emerald-800/60 text-white'
                  }`}
                >
                  <Headphones className="w-4 h-4" />
                  <span>التمييز الصوتي</span>
                </button>

                <button
                  onClick={() => setActiveTab('quiz')}
                  className={`btn-tactile px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 ${
                    activeTab === 'quiz' ? 'bg-amber-400 text-slate-900 font-black shadow-md' : 'bg-emerald-800/60 text-white'
                  }`}
                >
                  <Award className="w-4 h-4" />
                  <span>الاختبارات</span>
                </button>
              </nav>
            </div>
          </header>

          {/* Main Content Router */}
          <main className="max-w-7xl mx-auto px-4 pt-6">
            {activeTab === 'home' && (
              <HomeView 
                completedLetters={completedLetters} 
                startLetterUnit={startLetterUnit}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === 'unit' && (
              <UnitReaderView 
                currentLetter={currentLetter}
                slideIndex={slideIndex}
                handleNextSlide={handleNextSlide}
                handlePrevSlide={handlePrevSlide}
                setSlideIndex={setSlideIndex}
                playAudioText={playAudioText}
                setActiveTab={setActiveTab}
                selectedLetterId={selectedLetterId}
                setSelectedLetterId={setSelectedLetterId}
              />
            )}

            {activeTab === 'special' && (
              <SpecialPhoneticsView playAudioText={playAudioText} />
            )}

            {activeTab === 'minimal' && (
              <MinimalPairsView playAudioText={playAudioText} />
            )}

            {activeTab === 'quiz' && (
              <QuizView playAudioText={playAudioText} />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
